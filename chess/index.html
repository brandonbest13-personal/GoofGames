<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Canvas Chess</title>
  
  <!-- Lightweight chess logic engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #020617;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    #game-container {
      width: 100%;
      max-width: 500px;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    /* Top HUD */
    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .hud-title {
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .turn-white { color: #f8fafc; }
    .turn-black { color: #ef4444; }

    select {
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }

    /* Canvas Area */
    #board-wrapper {
      position: relative;
      background: #000;
      border: 4px solid #1e293b;
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1 / 1;
      cursor: pointer;
      touch-action: none; /* Prevents mobile scrolling while playing */
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      background: #334155;
      color: #f8fafc;
      border: none;
      border-radius: 6px;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.1s;
    }

    button:hover { background: #475569; }
    button:active { background: #1e293b; }
    
    #btn-reset { color: #ef4444; }

    /* Modals */
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(2, 6, 23, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      border-radius: 12px;
      text-align: center;
    }

    .hidden { display: none !important; }

    .modal h1 {
      font-size: 32px;
      margin-bottom: 20px;
      text-transform: uppercase;
      color: #38bdf8;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="hud">
    <div id="turn-indicator" class="hud-title turn-white">White's Turn</div>
    <select id="cpu-diff">
      <option value="0">Pass & Play</option>
      <option value="1">CPU: Random</option>
      <option value="2" selected>CPU: Greedy</option>
      <option value="3">CPU: Thinker</option>
    </select>
  </div>

  <div id="board-wrapper">
    <!-- Internal resolution is 480x480 (8 squares of 60x60) -->
    <canvas id="gameCanvas" width="480" height="480"></canvas>
    
    <div id="gameover-modal" class="modal hidden">
      <h1 id="winner-text">CHECKMATE</h1>
      <button id="btn-play-again" style="width: 200px; background: #38bdf8; color: #020617;">Play Again</button>
    </div>
  </div>

  <div class="controls">
    <button id="btn-undo">Undo Move</button>
    <button id="btn-reset">Resign</button>
  </div>
</div>

<script>
  // --- Game Engine Setup ---
  const game = new Chess();
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  const SIZE = 480;
  const CELL = SIZE / 8; // 60px per square
  
  const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
  const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];

  let selectedSquare = null;
  let legalMoves = [];
  let isCPUThinking = false;

  const els = {
    turnInd: document.getElementById('turn-indicator'),
    cpuDiff: document.getElementById('cpu-diff'),
    modal: document.getElementById('gameover-modal'),
    winnerText: document.getElementById('winner-text'),
    btnUndo: document.getElementById('btn-undo'),
    btnReset: document.getElementById('btn-reset'),
    btnPlayAgain: document.getElementById('btn-play-again')
  };

  // --- Rendering Engine (Sprites & Board) ---
  const C_DARK = '#1e293b';
  const C_LIGHT = '#334155';
  const C_HIGHLIGHT = 'rgba(56, 189, 248, 0.4)';
  const C_VALID = 'rgba(34, 197, 94, 0.6)';

  function drawBoard() {
    ctx.clearRect(0, 0, SIZE, SIZE);

    // Draw Grid
    for (let r = 0; r < 8; r++) {
      for (let f = 0; f < 8; f++) {
        const isDark = (r + f) % 2 !== 0;
        ctx.fillStyle = isDark ? C_DARK : C_LIGHT;
        ctx.fillRect(f * CELL, r * CELL, CELL, CELL);

        const sqAlgebraic = files[f] + ranks[r];

        // Draw Selection Highlight
        if (selectedSquare === sqAlgebraic) {
          ctx.fillStyle = C_HIGHLIGHT;
          ctx.fillRect(f * CELL, r * CELL, CELL, CELL);
        }

        // Draw Legal Move Dots
        if (legalMoves.some(m => m.to === sqAlgebraic)) {
          ctx.beginPath();
          ctx.arc(f * CELL + CELL/2, r * CELL + CELL/2, 8, 0, Math.PI * 2);
          ctx.fillStyle = C_VALID;
          ctx.fill();
        }
      }
    }

    // Draw Pieces
    const board = game.board();
    for (let r = 0; r < 8; r++) {
      for (let f = 0; f < 8; f++) {
        const piece = board[r][f];
        if (piece) {
          drawSprite(piece.type, piece.color, f * CELL, r * CELL);
        }
      }
    }
  }

  function drawSprite(type, color, px, py) {
    // Colors: Ivory for White, Crimson for Black
    const fill = color === 'w' ? '#f8fafc' : '#ef4444';
    const shadow = color === 'w' ? '#94a3b8' : '#7f1d1d';
    
    ctx.save();
    ctx.translate(px, py);

    // Common Base for all pieces
    ctx.fillStyle = shadow;
    ctx.fillRect(10, 48, 40, 6);
    ctx.fillStyle = fill;
    ctx.fillRect(12, 44, 36, 6);

    ctx.fillStyle = fill;
    ctx.strokeStyle = shadow;
    ctx.lineWidth = 2;

    switch(type) {
      case 'p': // Pawn
        ctx.beginPath();
        ctx.moveTo(30, 20); // Top
        ctx.lineTo(40, 44); // Bottom Right
        ctx.lineTo(20, 44); // Bottom Left
        ctx.fill();
        ctx.stroke();
        // Head
        ctx.beginPath();
        ctx.arc(30, 18, 10, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
        break;
        
      case 'r': // Rook
        ctx.fillRect(16, 20, 28, 24); // Body
        ctx.strokeRect(16, 20, 28, 24);
        // Battlements
        ctx.fillRect(14, 12, 8, 12); ctx.strokeRect(14, 12, 8, 12);
        ctx.fillRect(26, 12, 8, 12); ctx.strokeRect(26, 12, 8, 12);
        ctx.fillRect(38, 12, 8, 12); ctx.strokeRect(38, 12, 8, 12);
        break;

      case 'n': // Knight
        ctx.beginPath();
        ctx.moveTo(18, 44); // Bottom left
        ctx.lineTo(42, 44); // Bottom right
        ctx.lineTo(38, 25); // Back
        ctx.lineTo(44, 15); // Ear
        ctx.lineTo(28, 10); // Top head
        ctx.lineTo(14, 25); // Snout
        ctx.lineTo(22, 30); // Jaw
        ctx.lineTo(18, 44); // Neck
        ctx.fill(); ctx.stroke();
        // Eye
        ctx.fillStyle = shadow;
        ctx.fillRect(30, 16, 4, 4);
        break;

      case 'b': // Bishop
        ctx.beginPath();
        ctx.moveTo(24, 44);
        ctx.lineTo(36, 44);
        ctx.lineTo(38, 26);
        ctx.lineTo(30, 12); // Point
        ctx.lineTo(22, 26);
        ctx.fill(); ctx.stroke();
        // Cross cutout
        ctx.fillStyle = shadow;
        ctx.fillRect(29, 22, 2, 8);
        ctx.fillRect(26, 25, 8, 2);
        // Top ball
        ctx.beginPath();
        ctx.arc(30, 9, 3, 0, Math.PI*2);
        ctx.fillStyle = fill;
        ctx.fill(); ctx.stroke();
        break;

      case 'q': // Queen
        ctx.beginPath();
        ctx.moveTo(20, 44);
        ctx.lineTo(40, 44);
        ctx.lineTo(48, 15); // Right point
        ctx.lineTo(35, 25); // Right valley
        ctx.lineTo(30, 10); // Center point
        ctx.lineTo(25, 25); // Left valley
        ctx.lineTo(12, 15); // Left point
        ctx.fill(); ctx.stroke();
        break;

      case 'k': // King
        ctx.beginPath();
        ctx.moveTo(18, 44);
        ctx.lineTo(42, 44);
        ctx.lineTo(44, 20); // Right edge
        ctx.lineTo(30, 25); // Valley
        ctx.lineTo(16, 20); // Left edge
        ctx.fill(); ctx.stroke();
        // Cross on top
        ctx.fillStyle = fill;
        ctx.fillRect(28, 6, 4, 16); ctx.strokeRect(28, 6, 4, 16);
        ctx.fillRect(24, 10, 12, 4); ctx.strokeRect(24, 10, 12, 4);
        break;
    }
    ctx.restore();
  }

  // --- Interaction & Input ---
  canvas.addEventListener('pointerdown', (e) => {
    if (isCPUThinking || game.game_over()) return;
    
    // CPU Turn enforcement
    const cpuLevel = parseInt(els.cpuDiff.value);
    if (cpuLevel > 0 && game.turn() === 'b') return;

    const rect = canvas.getBoundingClientRect();
    const scale = SIZE / rect.width;
    
    const cx = Math.floor(((e.clientX - rect.left) * scale) / CELL);
    const cy = Math.floor(((e.clientY - rect.top) * scale) / CELL);

    if (cx < 0 || cx > 7 || cy < 0 || cy > 7) return;

    const clickedSq = files[cx] + ranks[cy];
    const piece = game.get(clickedSq);

    // If clicking a legal move destination
    if (selectedSquare && legalMoves.some(m => m.to === clickedSq)) {
      executeMove({
        from: selectedSquare,
        to: clickedSq,
        promotion: 'q' // Auto-promote to Queen
      });
      return;
    }

    // Selecting a piece
    if (piece && piece.color === game.turn()) {
      selectedSquare = clickedSq;
      legalMoves = game.moves({ square: selectedSquare, verbose: true });
    } else {
      selectedSquare = null;
      legalMoves = [];
    }
    
    drawBoard();
  });

  function executeMove(moveObj) {
    const move = game.move(moveObj);
    if (move) {
      selectedSquare = null;
      legalMoves = [];
      drawBoard();
      updateHUD();
      
      if (!game.game_over()) {
        const cpuLevel = parseInt(els.cpuDiff.value);
        if (cpuLevel > 0 && game.turn() === 'b') {
          isCPUThinking = true;
          setTimeout(() => makeCPUMove(cpuLevel), 250); // Small delay for feel
        }
      }
    }
  }

  function updateHUD() {
    if (game.game_over()) {
      els.modal.classList.remove('hidden');
      if (game.in_checkmate()) {
        els.winnerText.innerText = game.turn() === 'w' ? 'BLACK WINS' : 'WHITE WINS';
        els.winnerText.style.color = game.turn() === 'w' ? '#ef4444' : '#f8fafc';
      } else {
        els.winnerText.innerText = 'DRAW';
        els.winnerText.style.color = '#eab308';
      }
    } else {
      const isWhite = game.turn() === 'w';
      els.turnInd.innerText = isWhite ? "White's Turn" : "Black's Turn";
      els.turnInd.className = `hud-title ${isWhite ? 'turn-white' : 'turn-black'}`;
    }
  }

  // --- CPU AI Logic ---
  const pieceValues = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };

  function evaluateBoard(gameInstance) {
    let totalEval = 0;
    const board = gameInstance.board();
    for (let r = 0; r < 8; r++) {
      for (let f = 0; f < 8; f++) {
        const sq = board[r][f];
        if (sq) {
          const val = pieceValues[sq.type];
          totalEval += sq.color === 'w' ? val : -val;
        }
      }
    }
    return totalEval;
  }

  function getBestMove(gameInstance, depth, isMaximizing) {
    const moves = gameInstance.moves({ verbose: true });
    if (depth === 0 || moves.length === 0) return moves[Math.floor(Math.random() * moves.length)];

    let bestMove = null;
    let bestValue = isMaximizing ? -9999 : 9999;

    for (let i = 0; i < moves.length; i++) {
      const move = moves[i];
      gameInstance.move(move);
      
      let boardValue;
      if (depth === 1) {
        boardValue = evaluateBoard(gameInstance);
      } else {
        boardValue = getBestMove(gameInstance, depth - 1, !isMaximizing).value;
      }
      
      gameInstance.undo();

      if (isMaximizing) {
        if (boardValue > bestValue) {
          bestValue = boardValue;
          bestMove = move;
        }
      } else {
        if (boardValue < bestValue) {
          bestValue = boardValue;
          bestMove = move;
        }
      }
    }

    if (!bestMove) bestMove = moves[Math.floor(Math.random() * moves.length)];
    return depth === 1 || depth === 2 ? bestMove : { move: bestMove, value: bestValue };
  }

  function makeCPUMove(level) {
    if (game.game_over()) return;

    let move;
    if (level === 1) move = getBestMove(game, 0, false); // Random
    else if (level === 2) move = getBestMove(game, 1, false); // Greedy
    else move = getBestMove(game, 2, false); // Thinker

    if (move) {
      game.move(move);
    }
    
    isCPUThinking = false;
    drawBoard();
    updateHUD();
  }

  // --- Buttons ---
  els.btnUndo.addEventListener('click', () => {
    if (isCPUThinking) return;
    game.undo();
    // If playing CPU, undo twice to get back to player's turn
    if (parseInt(els.cpuDiff.value) > 0 && game.turn() === 'b') {
      game.undo();
    }
    selectedSquare = null;
    legalMoves = [];
    drawBoard();
    updateHUD();
  });

  els.btnReset.addEventListener('click', resetGame);
  els.btnPlayAgain.addEventListener('click', resetGame);
  els.cpuDiff.addEventListener('change', resetGame);

  function resetGame() {
    game.reset();
    selectedSquare = null;
    legalMoves = [];
    isCPUThinking = false;
    els.modal.classList.add('hidden');
    drawBoard();
    updateHUD();
  }

  // Init
  drawBoard();
  updateHUD();

</script>
</body>
</html>
